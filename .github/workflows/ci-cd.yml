name: ShopSphere CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Check backend syntax
        run: node --check src/server.js

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/javascript 

  docker-security:
    name: Docker Build and Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t shopsphere-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t shopsphere-frontend:ci ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shopsphere-backend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shopsphere-frontend:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH              
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag images for GHCR
        run: |
          IMAGE_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')

          docker tag shopsphere-backend:ci ghcr.io/$IMAGE_OWNER/shopsphere-backend:${GITHUB_SHA}
          docker tag shopsphere-backend:ci ghcr.io/$IMAGE_OWNER/shopsphere-backend:latest

          docker tag shopsphere-frontend:ci ghcr.io/$IMAGE_OWNER/shopsphere-frontend:${GITHUB_SHA}
          docker tag shopsphere-frontend:ci ghcr.io/$IMAGE_OWNER/shopsphere-frontend:latest

      - name: Push backend image
        run: |
          IMAGE_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$IMAGE_OWNER/shopsphere-backend:${GITHUB_SHA}
          docker push ghcr.io/$IMAGE_OWNER/shopsphere-backend:latest

      - name: Push frontend image
        run: |
          IMAGE_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$IMAGE_OWNER/shopsphere-frontend:${GITHUB_SHA}
          docker push ghcr.io/$IMAGE_OWNER/shopsphere-frontend:latest    

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/devopsadmin/shopsphere-ecommerce
            docker compose pull backend frontend
            docker compose up -d --force-recreate backend frontend
            echo "Waiting for ShopSphere to become healthy..."

            for i in {1..12}; do
              if curl -fsS http://localhost:3000/api/health; then
                echo "ShopSphere is healthy."
                exit 0
              fi

              echo "Health check failed. Retrying in 5 seconds..."
              sleep 5
            done

            echo "ShopSphere health check failed after 60 seconds."
            exit 1
