services:
  mysql:
    image: mysql:8.0
    container_name: shopsphere-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: shopsphere_root_password
      MYSQL_DATABASE: shopsphere

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pshopsphere_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: shopsphere-backend
    restart: unless-stopped

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: shopsphere_root_password
      DB_NAME: shopsphere
      JWT_SECRET: shopsphere_docker_secret_2026
      JWT_EXPIRES_IN: 7d

    ports:
      - "5000:5000"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: